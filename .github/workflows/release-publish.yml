name: Release Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Unit tests
        run: python -m pytest -q

      - name: Build release ZIPs (source + portable EXE)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\create-release-zips.ps1

      - name: Build Microsoft Store package (MSIX, unsigned; the Store signs it)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_msix.ps1

      - name: Resolve version and asset paths
        id: meta
        shell: pwsh
        run: |
          $ver = (Select-String -Path "fluentvoice\__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $src = "dist/fluentvoice-pro-$ver-windows.zip"
          $port = "dist/FluentVoicePro-$ver-portable-win64.zip"
          if (-not (Test-Path $src)) { throw "missing $src" }
          if (-not (Test-Path $port)) { throw "missing $port" }
          $msix = "dist/FluentVoicePro-$ver-x64.msix"
          if (-not (Test-Path $msix)) { throw "missing $msix" }
          "msix=$msix" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "source_zip=$src" >> $env:GITHUB_OUTPUT
          "portable_zip=$port" >> $env:GITHUB_OUTPUT

      - name: Tag must match package version
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          if ("$env:GITHUB_REF_NAME" -ne "v$ver") { throw "Tag $env:GITHUB_REF_NAME does not match __version__ v$ver" }

      - name: SHA-256 checksums
        id: sums
        shell: pwsh
        run: |
          $files = @("${{ steps.meta.outputs.source_zip }}", "${{ steps.meta.outputs.portable_zip }}", "${{ steps.meta.outputs.msix }}")
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          "sums=dist/SHA256SUMS.txt" >> $env:GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $notes = @"
          ## FluentVoice Pro v$ver

          ### Download options (pick one)
          1. **Recommended — Source ZIP** ``fluentvoice-pro-$ver-windows.zip``
             - Needs Python 3.10+ · run ``install.ps1``
          2. **Portable EXE ZIP** ``FluentVoicePro-$ver-portable-win64.zip``
             - No Python · run ``FluentVoicePro.exe`` (tray)
          3. ``FluentVoicePro-$ver-x64.msix`` is the package submitted to the **Microsoft Store** (unsigned: the Store signs it). Install FluentVoice Pro from the Store rather than this file.

          All assets are **GitHub Artifact Attested** (green verification on this Release) and listed in ``SHA256SUMS.txt``.
          Already on v1.4.17+? Settings → About & Developer → **Check for Updates** downloads and SHA-256-verifies this release for you.

          ### Verify
          ``````powershell
          gh attestation verify .\fluentvoice-pro-$ver-windows.zip --repo ${{ github.repository }}
          Get-FileHash .\fluentvoice-pro-$ver-windows.zip -Algorithm SHA256   # compare with SHA256SUMS.txt
          ``````
          Windows SmartScreen / Unblock / firewall notes: see ``docs/WINDOWS_TRUST.md`` in the source ZIP.

          "@
          $cl = Get-Content CHANGELOG.md -Raw
          if ($cl -match "(?s)## \[$ver\].*?(?=## \[|\z)") {
            $notes += "`n### Changelog`n`n" + $Matches[0].Trim() + "`n"
          }
          $notes | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md | Select-Object -First 40

      - name: Attest source ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.source_zip }}

      - name: Attest portable ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.portable_zip }}

      - name: Attest MSIX
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.msix }}

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.sums.outputs.sums }}

      - name: Verify attestations (green check before publishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          foreach ($f in @("${{ steps.meta.outputs.source_zip }}", "${{ steps.meta.outputs.portable_zip }}", "${{ steps.meta.outputs.msix }}", "${{ steps.sums.outputs.sums }}")) {
            gh attestation verify $f --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed for $f" }
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = "${{ steps.meta.outputs.version }}"
          $src = "${{ steps.meta.outputs.source_zip }}"
          $port = "${{ steps.meta.outputs.portable_zip }}"
          $sums = "${{ steps.sums.outputs.sums }}"
          $msix = "${{ steps.meta.outputs.msix }}"
          $title = "FluentVoice Pro $ver — Attested source ZIP + portable EXE"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $src $port $msix $sums --clobber
            gh release edit $tag --title $title --notes-file release-notes.md
          } else {
            gh release create $tag $src $port $msix $sums --title $title --notes-file release-notes.md --latest
          }
